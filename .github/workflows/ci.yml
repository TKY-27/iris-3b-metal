name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests use tiny random models; nothing may be downloaded from the Hub.
  HF_HUB_OFFLINE: "1"
  # The runners' virtual GPU is not an Apple Silicon GPU; GPU tests run locally.
  IRIS_SKIP_GPU_TESTS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.suite }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # the full suite, upstream training code included, on the tested Python
          - python: "3.14"
            suite: full
            extras: train,dev
            tests: tests
          # the engine and its interfaces on the oldest supported Python
          - python: "3.11"
            suite: engine
            extras: dev
            tests: tests/test_metal_*.py tests/test_compare_runs.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[${{ matrix.extras }}]"
      - if: matrix.suite == 'full'
        run: |
          ruff check .
          ruff format --check .
      - run: python -m pytest -q ${{ matrix.tests }}
      - name: Build and smoke-test the wheel
        if: matrix.suite == 'full'
        run: |
          pip install build
          python -m build
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --quiet dist/*.whl
          /tmp/wheel-env/bin/iris-metal --help > /dev/null
          /tmp/wheel-env/bin/iris-metal serve --help > /dev/null

  app:
    name: macOS app
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # server layer only; no weights are downloaded
      - run: pip install -e .
        working-directory: ${{ github.workspace }}
      - run: xcodebuild -version
      - name: Start the stand-in engine
        run: |
          python fake_engine.py --port 0 > "$RUNNER_TEMP/fake-engine.log" 2>&1 &
          echo "FAKE_ENGINE_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 90); do
            port=$(sed -n 's/^fake engine on http:\/\/127\.0\.0\.1:\([0-9]*\)$/\1/p' "$RUNNER_TEMP/fake-engine.log")
            if [ -n "$port" ] && curl -sf "http://127.0.0.1:$port/v1/health" > /dev/null; then
              echo "IRIS_TEST_PORT=$port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "the stand-in engine did not start"
          cat "$RUNNER_TEMP/fake-engine.log"
          exit 1
      - name: Test
        env:
          TEST_RUNNER_IRIS_ENGINE_TEST: "1"
          TEST_RUNNER_IRIS_TEST_PORT: ${{ env.IRIS_TEST_PORT }}
        run: >-
          xcodebuild test -project Iris.xcodeproj -scheme Iris -destination platform=macOS
          -derivedDataPath ${{ runner.temp }}/dd CODE_SIGNING_ALLOWED=NO
      - name: Stop the stand-in engine
        if: always()
        run: kill "$FAKE_ENGINE_PID" 2> /dev/null || true
      - name: Release build
        run: >-
          xcodebuild build -project Iris.xcodeproj -scheme Iris -configuration Release
          -derivedDataPath ${{ runner.temp }}/dd CODE_SIGNING_ALLOWED=NO
