name: Iris
options:
  bundleIdPrefix: io.github.tky27
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, ja]
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Iris:
    type: application
    platform: macOS
    sources:
      - path: Iris
    info:
      path: Iris/Info.plist
      properties:
        CFBundleDisplayName: Iris
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "Copyright © 2026 the Iris-3B-Metal authors. Apache License 2.0."
        # the engine is a local process on 127.0.0.1
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tky27.iris
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
  IrisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: IrisTests
    dependencies:
      - target: Iris
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tky27.iris.tests
schemes:
  Iris:
    build:
      targets:
        Iris: all
    test:
      targets:
        - IrisTests
