[project]
name = "iris-3b"
version = "0.1.0"
description = "Iris-3B: a pixel-space text-to-image diffusion transformer"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7.1",
    "torchvision>=0.21",
    "transformers>=4.57.0",
    "accelerate>=1.2",
    "omegaconf>=2.3",
    "safetensors>=0.4",
    "huggingface_hub>=0.26",
    "wandb>=0.18",
    "pillow>=10.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "dion @ git+https://github.com/microsoft/dion.git@58d38adb5fcd403a116cb16157a5ca824f8538a5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
ui = ["gradio>=5.49,<6", "spaces"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/iris3b", "src/iris_metal"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
